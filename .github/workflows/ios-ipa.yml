name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'main', 'master']
    paths: ['app/**', '.github/workflows/ios-ipa.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Kealen.xcworkspace \
            -scheme Kealen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kealen.app Payload/
          zip -qry Kealen-unsigned.ipa Payload
          ls -lh Kealen-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kealen-unsigned-ipa
          path: app/Kealen-unsigned.ipa

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Kealen iOS test build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: app/Kealen-unsigned.ipa
          body: |
            File IPA chưa ký (unsigned). Cài bằng Sideloadly hoặc AltStore với Apple ID của bạn.
